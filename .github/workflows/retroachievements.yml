name: RetroAchievements validation

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/retroachievements.yml'
      - 'port/src/**'
      - 'port/tests/ra_*'
      - 'port/tests/run_ra_*.py'
      - 'port/tools/**'
      - 'port/third_party/rcheevos/**'
  pull_request:
    paths:
      - '.github/workflows/retroachievements.yml'
      - 'port/src/**'
      - 'port/tests/ra_*'
      - 'port/tests/run_ra_*.py'
      - 'port/tools/**'
      - 'port/third_party/rcheevos/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retroachievements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: port/release
          tags: bt3-port-release:jammy
          load: true
          cache-from: type=gha,scope=ra-release
          cache-to: type=gha,mode=max,scope=ra-release
      - name: Offline memory and real-runtime tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src bt3-port-release:jammy sh -ec '
            mkdir -p port/build
            cc -std=c99 -Wall -Wextra -Werror port/src/ra_memory.c port/tests/ra_memory.c -o port/build/ra_memory_test
            port/build/ra_memory_test
            python3 port/tests/run_ra_client.py
            python3 port/tests/run_ra_game.py
          '
      - name: Build complete Linux and Windows archives
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src \
            bt3-port-release:jammy sh port/release/inside.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RetroAchievements-validation
          path: |
            port/build/Tenkaichi3Decomp-linux-x64.zip
            port/build/Tenkaichi3Decomp-windows-x64.zip
          if-no-files-found: error
